<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Raider Toolkit</title>
<link rel="stylesheet" href="style.css">
<style>
  /* the main window is a normal program window: Windows draws its title bar, and the background is solid */
  html, body { background: rgb(var(--bg)); }
  body { padding: 0; }
  .panel { height: 100%; display: flex; flex-direction: column; background: rgb(var(--bg)); overflow: hidden; }
  nav.side .grow { flex: 1; }
  nav.side .sep { height: 1px; background: var(--line); margin: 6px 4px; flex-shrink: 0; }
  .sfoot { display: flex; flex-direction: column; gap: 8px; padding: 10px 6px 2px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); }
  .sfoot .st { display: flex; align-items: center; gap: 8px; color: var(--dim); font-weight: 600; font-size: 13px; }
  .sfoot .st .dot { flex-shrink: 0; }
  .sfoot kbd, .gs kbd { font: 600 11px var(--mono); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--fg); white-space: nowrap; }
  .sfoot .rpb { display: flex; align-items: center; justify-content: center; gap: 7px; border-color: rgba(255,159,67,.35); color: #e9dccf; }
  .sfoot .rpb:hover { border-color: #ff9f43; background: rgba(255,159,67,.08); color: #fff; }
  .rpb i { width: 15px; height: 15px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #ff9f43; position: relative; flex: none; }
  .rpb i::before, .rpb i::after { content: ""; position: absolute; left: 50%; width: 1.5px; margin-left: -.75px; background: #ff9f43; border-radius: 1px; }
  .rpb i::before { top: 2.4px; height: 5px; } .rpb i::after { top: 8.6px; height: 1.5px; }
  .rpov { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(4,4,12,.7); backdrop-filter: blur(3px); }
  .rpov[hidden] { display: none; }
  .rpdlg { width: min(460px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; border-radius: 14px; background: #12122a; border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 70px rgba(0,0,0,.6); }
  .rph { display: flex; align-items: center; justify-content: space-between; }
  .rph h3 { margin: 0; font-size: 17px; }
  .rph .x { width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(255,255,255,.14); background: transparent; color: var(--fg); font-size: 18px; line-height: 1; }
  .rpf { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--dim); position: relative; }
  .rpf em { font-style: normal; font-weight: 400; color: var(--faint); }
  .rpf select, .rpf textarea, .rpf input { font: inherit; font-weight: 400; color: var(--fg); background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.14); border-radius: 9px; padding: 9px 11px; }
  .rpf textarea { resize: vertical; min-height: 110px; }
  .rpf select option { background: #12122a; }
  .rpcount { position: absolute; right: 10px; bottom: 8px; font-size: 11px; color: var(--faint); font-weight: 400; }
  .rpfoot { display: flex; align-items: center; gap: 14px; justify-content: space-between; }
  .rpfoot small { font-size: 11.5px; color: var(--faint); font-weight: 400; }
  .rpstat { margin: 0; min-height: 1em; font-size: 13px; color: var(--dim); }
  .rpstat.ok { color: var(--cyan); } .rpstat.bad { color: #ff8f8f; }
  .sfoot button { height: 32px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-weight: 600; font-size: 12.5px; }
  .home { max-width: 980px; padding-bottom: 24px; }
  .home .lead { margin: 0 0 18px; color: var(--dim); font-size: 15px; }
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
  .step { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 20px 20px 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); }
  .step .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgba(95,242,234,.14); color: var(--cyan); font: 700 13px var(--mono); }
  .step h2 { margin: 4px 0 0; font: 600 13px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .step .big { margin: 0; font: 800 21px/1.2 var(--display); color: var(--fg); }
  .step .big kbd { font: 700 15px var(--mono); padding: 4px 9px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); white-space: nowrap; }
  .step .note { margin: 0; flex: 1; line-height: 1.5; font-size: 14px; }
  .step .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .step .btn, .imp .btn { height: 40px; padding: 0 16px; font-size: 14px; }
  .imp { margin-top: 18px; padding: 20px; border-radius: 16px; border: 1px solid rgba(95,242,234,.22); background: rgba(95,242,234,.04); }
  .imp h2 { margin: 0 0 4px; font: 800 18px var(--display); }
  .imp .pr { display: flex; gap: 8px; margin: 12px 0 6px; } .imp .pr input { flex: 1; min-width: 0; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: var(--fg); font: 14px var(--mono); }
  .imp .pr input:focus { outline: 0; border-color: rgba(95,242,234,.6); }
  .where { display: grid; gap: 10px; margin: 14px 0 8px; } .where div { display: grid; grid-template-columns: 150px 1fr; gap: 12px; font-size: 14px; line-height: 1.5; }
  .where dt { font-weight: 700; color: var(--fg); } .where dd { margin: 0; color: #d6d3e6; }

  @media (max-width: 620px) { .where div { grid-template-columns: 1fr; gap: 2px; } }
  .gs { margin: 14px 0 6px; padding: 16px 18px; border-radius: 14px; border: 1px solid rgba(95,242,234,.25); background: rgba(95,242,234,.05); max-width: 760px; }
  .gs h2 { margin: 0 0 10px; font: 800 18px var(--display); }

  .gs li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 14px; line-height: 1.45; color: #d6d3e6; counter-increment: gs; }
  .gs li::before { content: counter(gs); width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(95,242,234,.16); color: var(--cyan); font: 700 12px var(--mono); }
  .gs .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .subtabs { display: inline-flex; gap: 4px; padding: 3px; border-radius: 10px; background: rgba(255,255,255,.05); }
  .subtabs button { height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: var(--dim); font-weight: 600; font-size: 13px; }
  .subtabs button[aria-selected="true"] { background: rgba(95,242,234,.16); color: var(--fg); }
  .mapbar input { flex: 1; min-width: 120px; height: 32px; }
  .how { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 12px 0 4px; max-width: 760px; }
  .how div { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 13px; line-height: 1.45; color: #d6d3e6; }
  .how b { display: block; color: var(--fg); margin-bottom: 3px; font-size: 14px; }
  .how kbd { font: 600 11px var(--mono); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--fg); white-space: nowrap; }
  .upd { border: 1px solid rgba(255,196,0,.5); background: rgba(255,196,0,.12); color: #ffd666; border-radius: 99px; padding: 5px 12px; font-weight: 600; font-size: 13px; }
  .body { flex: 1; min-height: 0; display: flex; }
  nav.side { width: 176px; flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; padding: 12px 10px; border-right: 1px solid var(--line); overflow-y: auto; }
  nav.side button { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--dim); font-weight: 600; font-size: 14px; text-align: left; }
  nav.side button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  nav.side button:hover { color: var(--fg); background: rgba(255,255,255,.04); }
  nav.side button[aria-selected="true"] { border-color: rgba(180,220,200,.3); background: rgba(180,220,200,.13); color: var(--fg); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .wrapc { max-width: 760px; }
  h1.tt { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 14px 0 4px; }
  .h { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--faint); padding: 14px 0 4px; text-transform: uppercase; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 44px; }

  .qty button { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--fg); line-height: 1; padding: 0; }
  .qty span { min-width: 64px; text-align: center; }
  .btn { height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid rgba(255,255,255,.16); background: transparent; color: var(--fg); font-weight: 600; white-space: nowrap; }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }

  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 2px; }

  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #22d65f, #5ff2ea); }
  input[type=text], input[type=search], select { width: 100%; height: 38px; border-radius: 9px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.25); padding: 0 11px; color: var(--fg); }
  select option { background: #15122a; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 10px 0; background: var(--card); display: flex; flex-direction: column; gap: 8px; }
  .err { color: #ff8a7a; font-size: 13px; }

  .res > button { display: flex; align-items: center; gap: 10px; min-height: 44px; border: 0; border-radius: 9px; background: transparent; text-align: left; padding: 0 6px; }
  .res > button:hover, .res > button:focus-visible { background: rgba(255,255,255,.06); }

  .detail h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 22px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }

  .chips button[aria-pressed="true"] { border-color: rgba(180,220,200,.4); background: rgba(180,220,200,.14); color: var(--fg); }
  .kbd { font-family: var(--mono); font-weight: 700; font-size: 12px; white-space: nowrap; padding: 4px 8px; border-radius: 7px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.05); }

  .spots { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 32px); gap: 4px; padding: 6px; border-radius: 10px; border: 1px solid var(--line); width: max-content; margin: 6px 0; }
  .spots button { border: 1px solid var(--line); border-radius: 6px; background: transparent; display: grid; place-items: center; padding: 0; }

  .spots button[aria-pressed="true"] { border-color: var(--cyan); } .spots button[aria-pressed="true"] i { background: var(--cyan); }
  /* settings: a small menu of groups, then rows with the label on the left and the control on the right */

  .snav button[aria-selected="true"] { border-color: rgba(180,220,200,.4); background: rgba(180,220,200,.14); color: var(--fg); }
  .sbox { max-width: 700px; }
  .srow { display: flex; align-items: center; gap: 18px; min-height: 58px; padding: 9px 0; border-bottom: 1px solid var(--line); }

  /* ---------- the main window: one calm column, in the site's colours (navy panels, cream main button) ---------- */

  .tabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255,255,255,.05); }
  .tabs button { height: 36px; padding: 0 16px; border: 0; border-radius: 9px; background: transparent; color: var(--dim); font-weight: 600; font-size: 14px; }
  .tabs button:hover { color: var(--fg); } .tabs button[aria-selected="true"] { background: #1b2247; color: var(--fg); }
