<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Raider Toolkit</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 6px; }
  .panel { height: 100%; display: flex; flex-direction: column; border-radius: 16px; background: rgba(var(--bg), var(--pbg, .95)); border: 1px solid rgba(255,255,255,.12); overflow: hidden; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 14px; border-bottom: 1px solid var(--line); }
  header b { font-family: var(--display); font-weight: 800; font-size: 15px; flex: 1; }
  .cond { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(95,242,234,.07); border-bottom: 1px solid var(--line); }
  .cond .grow { flex: 1; min-width: 0; }
  .cond small { display: block; color: var(--dim); font-size: 12px; }
  .cond strong { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cond .t { text-align: right; }
  .cond .t b { display: block; font-family: var(--mono); font-size: 17px; color: var(--cyan); }
  nav { display: flex; gap: 4px; padding: 10px 12px 6px; }
  nav button { flex: 1; height: 34px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--dim); font-weight: 600; font-size: 13px; }
  nav button[aria-selected="true"] { border-color: rgba(180,220,200,.35); background: rgba(180,220,200,.14); color: var(--fg); }
  main { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 14px 14px; user-select: text; }
  main::-webkit-scrollbar { width: 8px; } main::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }
  .h { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--faint); padding: 12px 0 4px; text-transform: uppercase; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.done .nm { text-decoration: line-through; color: #7c7894; }
  .qty { display: flex; align-items: center; gap: 2px; font-family: var(--mono); font-size: 13px; color: var(--mint); }
  .qty button { width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--fg); line-height: 1; padding: 0; }
  .qty span { min-width: 58px; text-align: center; }
  .btn { height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid rgba(255,255,255,.16); background: transparent; color: var(--fg); font-weight: 600; }
  .btn.go { border: 0; background: var(--cyan); color: #0c0916; }
  .btn:disabled { opacity: .45; cursor: default; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; margin: 6px 0 2px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #22d65f, #5ff2ea); }
  input[type=text], input[type=search], select { width: 100%; height: 38px; border-radius: 9px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.25); padding: 0 11px; color: var(--fg); }
  select option { background: #15122a; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 10px 0; background: var(--card); display: flex; flex-direction: column; gap: 8px; }
  .err { color: #ff8a7a; font-size: 13px; }
  .note { color: var(--dim); font-size: 13px; }
  .res { display: flex; flex-direction: column; }
  .res button { display: flex; align-items: center; gap: 10px; min-height: 44px; border: 0; border-radius: 9px; background: transparent; text-align: left; padding: 0 6px; }
  .res button:hover, .res button:focus-visible { background: rgba(255,255,255,.06); }
  .res .kind { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; }
  .card { display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); margin-bottom: 8px; }
  .card.on { border-color: rgba(95,242,234,.35); }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card .top b { flex: 1; font-size: 15px; }
  .star { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--faint); display: grid; place-items: center; }
  .star[aria-pressed="true"] { color: #ffc400; border-color: rgba(255,196,0,.4); }
  .star svg { width: 16px; height: 16px; fill: currentColor; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; font-size: 13px; margin-top: 8px; }
  .kv dt { color: var(--faint); } .kv dd { margin: 0; }
  .detail h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 22px; }
  .back { border: 0; background: none; color: var(--mint); padding: 6px 0; font-weight: 600; }
  label.chk { display: flex; align-items: center; gap: 10px; min-height: 40px; }
  label.chk input { width: 17px; height: 17px; accent-color: #5ff2ea; margin: 0; }
  .kbd { font-family: var(--mono); font-weight: 700; font-size: 12px; white-space: nowrap; padding: 4px 8px; border-radius: 7px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.05); }
  .link { border: 0; background: none; color: var(--mint); padding: 0; text-decoration: underline; font-weight: 600; }
  input[type=range] { width: 100%; accent-color: #5ff2ea; }
  .seg2 { display: flex; gap: 6px; margin-top: 6px; }
  .seg2 button { flex: 1; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: var(--dim); font-weight: 600; }
  .seg2 button[aria-pressed="true"] { border-color: rgba(180,220,200,.35); background: rgba(180,220,200,.14); color: var(--fg); }
  .spots { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 32px); gap: 4px; padding: 6px; border-radius: 10px; border: 1px solid var(--line); width: max-content; margin: 6px 0; }
  .spots button { border: 1px solid var(--line); border-radius: 6px; background: transparent; display: grid; place-items: center; padding: 0; }
  .spots button i { width: 14px; height: 6px; border-radius: 2px; background: #5a5672; }
  .spots button[aria-pressed="true"] { border-color: var(--cyan); } .spots button[aria-pressed="true"] i { background: var(--cyan); }
  body.gate nav, body.gate .cond, body.gate #hide { display: none; }
  .gate h1 { font-family: var(--display); font-weight: 800; font-size: 24px; margin: 16px 0 6px; }
  .gate .res { margin: 8px 0; border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .gate .kind { color: var(--mint); }
  label.chk.agree { align-items: flex-start; padding: 8px 0; } label.chk.agree input { margin-top: 2px; flex-shrink: 0; }
  .arr { list-style: none; margin: 6px 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .arr li { display: flex; align-items: center; gap: 6px; padding: 0 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  .arr li.dragging { border-color: var(--cyan); background: rgba(95,242,234,.08); }
  .arr .chk { flex: 1; min-width: 0; min-height: 42px; }
  .grip { width: 28px; height: 42px; display: grid; place-items: center; cursor: grab; touch-action: none; }
  .grip i { width: 8px; height: 16px; background: radial-gradient(circle, #8d88a6 1.3px, transparent 1.7px) 0 0 / 4px 5.4px; }
  .mv { width: 28px; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--dim); padding: 0; }
  .mv:disabled { opacity: .3; cursor: default; }
  pre.doc { white-space: pre-wrap; font: 13px/1.5 "Barlow", sans-serif; color: var(--fg); margin: 6px 0 0; }
</style>
</head>
<body>
<div class="panel">
  <header data-tauri-drag-region>
    <span class="logo" data-tauri-drag-region></span>
    <b data-tauri-drag-region>Raider Toolkit</b>
    <button class="ibtn" type="button" id="hide" aria-label="Hide the panel" title="Hide (or press your keybind)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </header>
  <div class="cond" id="cond"></div>
  <nav role="tablist" aria-label="Sections">
    <button type="button" role="tab" data-tab="list" aria-selected="true">List</button>
    <button type="button" role="tab" data-tab="maps" aria-selected="false">Maps</button>
    <button type="button" role="tab" data-tab="search" aria-selected="false">Search</button>
    <button type="button" role="tab" data-tab="settings" aria-selected="false">Settings</button>
  </nav>
  <main id="view"></main>
</div>
<script src="data.js"></script>
<script src="panel.js"></script>
</body>
</html>
