<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Raider Toolkit</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 6px; }
  .panel { height: 100%; display: flex; flex-direction: column; border-radius: 16px; background: rgba(var(--bg), var(--pbg, .95)); border: 1px solid rgba(255,255,255,.12); overflow: hidden; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 14px; border-bottom: 1px solid var(--line); }
  header b { font-family: var(--display); font-weight: 800; font-size: 15px; flex: 1; }
  .upd { border: 1px solid rgba(255,196,0,.5); background: rgba(255,196,0,.12); color: #ffd666; border-radius: 99px; padding: 5px 12px; font-weight: 600; font-size: 13px; }
  .body { flex: 1; min-height: 0; display: flex; }
  nav.side { width: 176px; flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; padding: 12px 10px; border-right: 1px solid var(--line); overflow-y: auto; }
  nav.side button { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--dim); font-weight: 600; font-size: 14px; text-align: left; }
  nav.side button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  nav.side button:hover { color: var(--fg); background: rgba(255,255,255,.04); }
  nav.side button[aria-selected="true"] { border-color: rgba(180,220,200,.3); background: rgba(180,220,200,.13); color: var(--fg); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .cond { display: flex; align-items: center; gap: 10px; padding: 10px 18px; background: rgba(95,242,234,.07); border-bottom: 1px solid var(--line); }
  .cond .grow { flex: 1; min-width: 0; }
  .cond small { display: block; color: var(--dim); font-size: 12px; }
  .cond strong { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cond .t { text-align: right; }
  .cond .t b { display: block; font-family: var(--mono); font-size: 17px; color: var(--cyan); }
  #view { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 18px 18px; user-select: text; }
  #view.full { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  #view::-webkit-scrollbar { width: 8px; } #view::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 4px; }
  .wrapc { max-width: 760px; }
  h1.tt { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 14px 0 4px; }
  .h { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; color: var(--faint); padding: 14px 0 4px; text-transform: uppercase; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .nm small { display: block; color: var(--faint); font-size: 12px; }
  .row.done .nm { text-decoration: line-through; color: #7c7894; }
  .qty { display: flex; align-items: center; gap: 2px; font-family: var(--mono); font-size: 13px; color: var(--mint); }
  .qty button { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--fg); line-height: 1; padding: 0; }
  .qty span { min-width: 64px; text-align: center; }
  .btn { height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid rgba(255,255,255,.16); background: transparent; color: var(--fg); font-weight: 600; white-space: nowrap; }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
  .btn.go { border: 0; background: var(--cyan); color: #0c0916; }
  .btn[aria-pressed="true"] { border-color: rgba(255,196,0,.5); color: #ffd666; }
  .btn:disabled { opacity: .45; cursor: default; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 2px; }
  .bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; margin: 6px 0 2px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #22d65f, #5ff2ea); }
  input[type=text], input[type=search], select { width: 100%; height: 38px; border-radius: 9px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.25); padding: 0 11px; color: var(--fg); }
  select option { background: #15122a; }
  .box { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 10px 0; background: var(--card); display: flex; flex-direction: column; gap: 8px; }
  .err { color: #ff8a7a; font-size: 13px; }
  .ok { color: #7ef0b0; font-size: 13px; }
  .note { color: var(--dim); font-size: 13px; }
  .res { display: flex; flex-direction: column; }
  .res > button { display: flex; align-items: center; gap: 10px; min-height: 44px; border: 0; border-radius: 9px; background: transparent; text-align: left; padding: 0 6px; }
  .res > button:hover, .res > button:focus-visible { background: rgba(255,255,255,.06); }
  .kind { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; }
  .card { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); margin-bottom: 10px; }
  .card.on { border-color: rgba(95,242,234,.35); }
  .card .top { display: flex; align-items: center; gap: 10px; }
  .card .top b { flex: 1; font-size: 15px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .grid2 .card { margin: 0; }
  .star { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--faint); display: grid; place-items: center; flex-shrink: 0; }
  .star[aria-pressed="true"] { color: #ffc400; border-color: rgba(255,196,0,.4); }
  .star svg { width: 16px; height: 16px; fill: currentColor; }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 13px; margin-top: 4px; }
  .kv dt { color: var(--faint); } .kv dd { margin: 0; }
  .detail h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 22px; }
  .back { border: 0; background: none; color: var(--mint); padding: 8px 0; font-weight: 600; }
  label.chk { display: flex; align-items: center; gap: 10px; min-height: 40px; }
  label.chk input { width: 17px; height: 17px; accent-color: #5ff2ea; margin: 0; flex-shrink: 0; }
  .obj { display: flex; align-items: flex-start; gap: 10px; padding: 4px 0; font-size: 14px; }
  .obj input { width: 17px; height: 17px; accent-color: #5ff2ea; margin: 2px 0 0; flex-shrink: 0; }
  .obj.done span { text-decoration: line-through; color: #7c7894; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chips button { height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--dim); font-weight: 600; font-size: 13px; }
  .chips button[aria-pressed="true"] { border-color: rgba(180,220,200,.4); background: rgba(180,220,200,.14); color: var(--fg); }
  .kbd { font-family: var(--mono); font-weight: 700; font-size: 12px; white-space: nowrap; padding: 4px 8px; border-radius: 7px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.05); }
  .link { border: 0; background: none; color: var(--mint); padding: 0; text-decoration: underline; font-weight: 600; }
  input[type=range] { width: 100%; max-width: 420px; accent-color: #5ff2ea; }
  .seg2 { display: flex; gap: 6px; margin-top: 6px; max-width: 420px; }
  .seg2 button { flex: 1; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: var(--dim); font-weight: 600; }
  .seg2 button[aria-pressed="true"] { border-color: rgba(180,220,200,.35); background: rgba(180,220,200,.14); color: var(--fg); }
  .spots { display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 32px); gap: 4px; padding: 6px; border-radius: 10px; border: 1px solid var(--line); width: max-content; margin: 6px 0; }
  .spots button { border: 1px solid var(--line); border-radius: 6px; background: transparent; display: grid; place-items: center; padding: 0; }
  .spots button i { width: 14px; height: 6px; border-radius: 2px; background: #5a5672; }
  .spots button[aria-pressed="true"] { border-color: var(--cyan); } .spots button[aria-pressed="true"] i { background: var(--cyan); }
  /* settings: a small menu of groups, then rows with the label on the left and the control on the right */
  .snav { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  .snav button { height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: transparent; color: var(--dim); font-weight: 600; font-size: 13px; }
  .snav button[aria-selected="true"] { border-color: rgba(180,220,200,.4); background: rgba(180,220,200,.14); color: var(--fg); }
  .sbox { max-width: 700px; }
  .srow { display: flex; align-items: center; gap: 18px; min-height: 58px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .srow .sl { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .srow .lb { font-weight: 600; font-size: 14px; }
  .srow small { color: var(--faint); font-size: 12.5px; line-height: 1.4; }
  .srow .sc { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-shrink: 0; max-width: 60%; flex-wrap: wrap; }
  .srow .sc select { width: 220px; }
  .srow .seg2 { margin: 0; width: 240px; }
  .srow .spots { margin: 0; }
  .sbox .h + .srow { border-top: 1px solid var(--line); }
  .sbox .note { margin: 10px 0; }
  .sld { display: flex; align-items: center; gap: 10px; width: 260px; }
  .sld input { flex: 1; }
  .sld b { width: 44px; text-align: right; font-family: var(--mono); font-size: 12.5px; font-weight: 400; color: var(--fg); }
  label.sw { position: relative; width: 42px; height: 24px; flex-shrink: 0; cursor: pointer; }
  label.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  label.sw span { position: absolute; inset: 0; border-radius: 99px; background: rgba(255,255,255,.14); transition: background .15s; }
  label.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #d6d3e6; transition: transform .15s; }
  label.sw input:checked + span { background: var(--cyan); }
  label.sw input:checked + span::after { transform: translateX(18px); background: #0c0916; }
  label.sw input:focus-visible + span { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .paste { margin: 12px 0; display: flex; flex-direction: column; gap: 6px; }
  .pr { display: flex; gap: 8px; }
  .pr input { flex: 1; }
  .code { font-family: var(--mono); font-size: 15px; letter-spacing: .06em; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(0,0,0,.25); user-select: all; }
  pre.doc { white-space: pre-wrap; font: 13px/1.55 "Barlow", sans-serif; color: var(--fg); margin: 6px 0 0; max-width: 760px; }
  .arr { list-style: none; margin: 6px 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-width: 700px; }
  .arr li { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
  .arr li.dragging { border-color: var(--cyan); background: rgba(95,242,234,.08); }
  .arr .chk { flex: 1; min-width: 0; min-height: 42px; }
  .grip { width: 28px; height: 42px; display: grid; place-items: center; cursor: grab; touch-action: none; }
  .grip i { width: 8px; height: 16px; background: radial-gradient(circle, #8d88a6 1.3px, transparent 1.7px) 0 0 / 4px 5.4px; }
  .mv { width: 28px; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--dim); padding: 0; }
  .mv:disabled { opacity: .3; cursor: default; }
  .pinb { height: 30px; padding: 0 9px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--dim); font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pinb[aria-pressed="false"] { border-color: rgba(95,242,234,.5); color: var(--cyan); }
  .mapbar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--dim); }
  .mapbar span { flex: 1; }
  iframe.map { flex: 1; width: 100%; border: 0; background: #0c0916; }
  body.gate nav.side, body.gate .cond, body.gate #hide, body.gate .upd { display: none; }
  .gate h1 { font-family: var(--display); font-weight: 800; font-size: 26px; margin: 18px 0 6px; }
  .gate { max-width: 620px; }
  .gate .res { margin: 8px 0; border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .gate .kind { color: var(--mint); }
  label.chk.agree { align-items: flex-start; padding: 8px 0; } label.chk.agree input { margin-top: 2px; }
  @media (max-width: 680px) {
    .body { flex-direction: column; }
    nav.side { width: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
    nav.side button span { display: none; }
    nav.side button { padding: 0 11px; }
    #view { padding: 6px 12px 14px; }
  }
</style>
</head>
<body>
<div class="panel">
  <header data-tauri-drag-region>
    <span class="logo" data-tauri-drag-region></span>
    <b data-tauri-drag-region>Raider Toolkit</b>
    <button type="button" class="upd" id="upd" hidden></button>
    <button class="ibtn" type="button" id="hide" aria-label="Hide the panel" title="Hide (or press your keybind)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
  </header>
  <div class="body">
    <nav class="side" role="tablist" aria-label="Sections" id="nav"></nav>
    <section class="main">
      <div class="cond" id="cond"></div>
      <div id="view"></div>
    </section>
  </div>
</div>
<script src="data.js"></script>
<script src="sync.js"></script>
<script src="panel.js"></script>
</body>
</html>
