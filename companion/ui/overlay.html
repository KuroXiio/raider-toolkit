<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Raider Toolkit overlay</title>
<link rel="stylesheet" href="style.css">
<style>
  /* everything is sized in em, so one font-size scales the whole overlay to the screen */
  html, body { background: transparent; height: auto; width: max-content; }
  body { font-size: calc(15px * var(--scale, 1)); padding: 0.5em; display: inline-block; }
  #hud { display: inline-flex; flex-direction: column; gap: 0.4em; padding: 0.6em 0.85em; border-radius: 0.9em; background: rgba(var(--bg), var(--bga, .8)); border: 1px solid rgba(255,255,255,.12); white-space: nowrap; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #hud.line { flex-direction: row; align-items: flex-start; gap: 1.2em; }
  #hud:empty { display: none; }
  .part { position: relative; display: flex; flex-direction: column; gap: 0.15em; }
  .ln { display: flex; align-items: center; gap: 0.5em; }
  .cond b { font-weight: 700; font-size: 1.12em; }
  .t { font-family: var(--mono); font-weight: 700; font-size: 1.05em; color: var(--cyan); }
  .m { color: #9ca3c4; font-size: 0.86em; font-weight: 600; }
  .mono { font-family: var(--mono); }
  .bar { width: 6em; height: 0.36em; border-radius: 0.2em; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #22d65f, #5ff2ea); }
  .ttl { color: #9ca3c4; font-size: 0.78em; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  .rows { display: flex; flex-direction: column; gap: 0.12em; font-size: 0.93em; }
  .r { display: flex; align-items: center; gap: 0.45em; min-width: 0; }
  .r .nm { overflow: hidden; text-overflow: ellipsis; }
  .r .q { color: var(--mint); font-family: var(--mono); margin-left: auto; padding-left: 0.6em; }
  .r img, .r .ph { width: 1.4em; height: 1.4em; object-fit: contain; flex-shrink: 0; }
  .r.sub { color: #d6d3e6; font-size: 0.9em; padding-left: 1.1em; }
  .r.door { white-space: normal; color: #d6d3e6; font-size: 0.88em; padding-left: 1.1em; max-width: 22em; }
  .more { color: #9ca3c4; font-size: 0.85em; }
  .dot { width: 0.55em; height: 0.55em; }
  /* while the panel is open, the overlay can be moved, and parts unpinned or pinned back */
  body.edit #hud { border: 1px dashed rgba(95,242,234,.9); cursor: move; }
  body.edit #hud * { pointer-events: none; }
  .pin { display: none; position: absolute; top: -0.2em; right: -0.4em; width: 1.6em; height: 1.6em; border-radius: 0.4em; border: 1px solid rgba(95,242,234,.7); background: rgba(12,9,22,.9); color: var(--cyan); padding: 0; font-size: 0.85em; cursor: pointer; }
  body.edit .pin { display: grid; place-items: center; pointer-events: auto !important; }
  .hint { display: none; font-size: 0.75em; color: var(--cyan); white-space: normal; max-width: 18em; }
  body.edit .hint { display: block; }
  /* an unpinned part in its own window: fills the window, the content shows as much as fits */
  html.w, html.w body { width: 100%; height: 100%; overflow: hidden; }
  html.w body { display: block; padding: 0.3em; }
  html.w #hud { display: flex; width: 100%; height: 100%; overflow: hidden; }
  html.w .part { flex: 1; min-height: 0; overflow: hidden; }
  html.w .rows { overflow: hidden; }
  .grip { display: none; position: absolute; right: 0.25em; bottom: 0.25em; width: 1.3em; height: 1.3em; cursor: nwse-resize; pointer-events: auto !important;
          background: linear-gradient(135deg, transparent 50%, var(--cyan) 50% 58%, transparent 58% 70%, var(--cyan) 70% 78%, transparent 78%); border: 0; padding: 0; }
  html.w body.edit .grip { display: block; }
</style>
</head>
<body>
<div id="hud" data-tauri-drag-region></div>
<button type="button" class="grip" id="grip" aria-label="Drag to resize"></button>
<script src="data.js"></script>
<script src="overlay.js"></script>
</body>
</html>
