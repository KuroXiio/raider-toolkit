<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Raider Toolkit · Map</title>
<link rel="stylesheet" href="style.css">
<style>
  [hidden] { display: none !important; }
  body { padding: 8px; }
  .win { height: 100%; display: grid; grid-template-columns: 1fr 270px; grid-template-rows: 54px 1fr; border-radius: 16px; overflow: hidden;
         background: rgba(var(--bg), var(--pa, .96)); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 16px; border-bottom: 1px solid var(--line); min-width: 0; }
  header h1 { margin: 0; font: 800 17px var(--display); white-space: nowrap; }
  .chip { font-size: 12px; font-weight: 600; color: #0c0916; background: var(--mint); padding: 2px 7px; border-radius: 6px; white-space: nowrap; }
  .chip.off { background: rgba(255,255,255,.1); color: var(--dim); }
  .nx { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nx .mono { color: var(--fg); }
  .sp { flex: 1; }
  select { height: 34px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.05); padding: 0 8px; }
  select option { background: #15122a; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; height: 32px; padding: 0 10px; color: var(--dim); }
  .seg button[aria-pressed="true"] { background: rgba(95,242,234,.16); color: var(--fg); }
  .x { width: 38px; height: 38px; border-radius: 10px; border: 0; background: rgba(255,255,255,.06); display: grid; place-items: center; }
  .x svg, .zb svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
  #stage { position: relative; overflow: hidden; background: #151224; cursor: grab; }
  #stage.drag { cursor: grabbing; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
  .zb { width: 40px; height: 40px; border-radius: 10px; border: 0; background: rgba(12,9,22,.88); color: var(--fg); display: grid; place-items: center; font: 700 18px Barlow, sans-serif; }
  #tip { position: absolute; pointer-events: none; padding: 5px 9px; border-radius: 8px; background: rgba(12,9,22,.94); border: 1px solid var(--line); font-size: 13px; max-width: 280px; display: none; }
  .wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); }
  aside { border-left: 1px solid var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; overflow: auto; min-height: 0; }
  .h { font: 400 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--faint); }
  .h.hi { color: var(--cyan); }
  label.ck { display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px; cursor: pointer; }
  label.ck input { width: 16px; height: 16px; accent-color: var(--cyan); margin: 0; }
  .sw { width: 11px; height: 11px; flex-shrink: 0; }
  .sw.l { border-radius: 50%; background: var(--cyan); } .sw.k { border-radius: 2px; background: #ffc400; } .sw.e { border-radius: 50%; background: #ffc400; }
  .sw.q { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 11px solid #ff7ab6; }
  .grp { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: #b9b4cc; }
  .row .mono { color: var(--fg); }
  .line { height: 1px; background: var(--line); flex-shrink: 0; }
  .stop { font: 800 18px/1.2 var(--display); }
  .sub { font-size: 13px; color: var(--mint); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .b { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.16); background: transparent; font-weight: 600; }
  .b.go { flex: 1; border: 0; background: var(--cyan); color: #0c0916; font-weight: 700; }
  .note { font-size: 12px; color: var(--faint); }
</style>
</head>
<body>
<div class="win">
  <header data-tauri-drag-region>
    <span class="dot" id="dot"></span>
    <h1 id="title" data-tauri-drag-region>Map</h1>
    <span class="chip off" id="chip">…</span>
    <span class="nx" id="next" data-tauri-drag-region></span>
    <span class="sp" data-tauri-drag-region></span>
    <span class="seg" id="floor" hidden><button type="button" data-floor="u">Upper</button><button type="button" data-floor="l">Lower</button></span>
    <label class="vh" for="mapsel" style="position:absolute;left:-9999px">Map</label>
    <select id="mapsel"></select>
    <button type="button" class="x" id="close" aria-label="Close the big map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div id="stage">
    <canvas id="cv" role="img" aria-label="Map with your pins"></canvas>
    <div class="wait" id="wait">Loading the map…</div>
    <div id="tip" role="status"></div>
    <div class="zoom">
      <button type="button" class="zb" id="zin" aria-label="Zoom in">+</button>
      <button type="button" class="zb" id="zout" aria-label="Zoom out">−</button>
      <button type="button" class="zb" id="zfit" aria-label="Fit the map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <aside id="side"></aside>
</div>
<script src="data.js"></script>
<script src="sync.js"></script>
<script src="mapview.js"></script>
<script src="bigmap.js"></script>
</body>
</html>
