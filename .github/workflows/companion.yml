name: Build companion app

# Builds the Windows installer for Raider Toolkit Companion and puts it in a DRAFT release, together with the
# Microsoft Store package (.msix) to upload in Partner Center. The Store signs that package itself.
# Nothing is public until you open the draft under Releases, check it and press Publish.
# Runs by itself when the app's code changes on main, or from the Actions tab ("Run workflow").
# A new build of the same version replaces the files in its draft. It does not run on tags: publishing a draft creates
# its tag on the commit the draft was first made from, and building that would put an old build into the release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "companion/**"
      - ".github/workflows/companion.yml"

permissions:
  contents: write

concurrency:
  group: companion
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: companion/src-tauri -> target
      - name: Check the update key is set up
        shell: bash
        run: |
          if grep -q PUBKEY_PENDING companion/src-tauri/tauri.conf.json; then echo "::error::The update public key is missing in companion/src-tauri/tauri.conf.json"; exit 1; fi
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret (see companion/README.md)"; exit 1; fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the update files, so installed apps only accept updates made with this key
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: companion
          tauriScript: npx --yes @tauri-apps/cli@2
          tagName: companion-v__VERSION__
          releaseName: Raider Toolkit Companion v__VERSION__
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          releaseBody: |
            An overlay with your Raider Toolkit shopping list, map condition, followed quests and keys, plus a panel you open with a keybind (Ctrl+Shift+Space by default) with the interactive map, quests, keys, search and settings. Installed copies update themselves once this release is published.

            It is an ordinary Windows window. It never reads, changes or connects to the game: no game files, memory, screen capture, injected code or simulated input. Everything it shows comes from raidkits.com and what you type in.

            Unofficial fan app, not affiliated with or endorsed by Embark Studios. Embark decides which programs are allowed with their game; use it at your own risk.

            Windows may show "Windows protected your PC" the first time, because this installer isn't code-signed. Press More info → Run anyway. On PCs with Smart App Control on, use the Microsoft Store version instead (signed by Microsoft).

            The `…_Store.msix` file is the Microsoft Store package, uploaded to Partner Center; you don't need it to install the app.
      - name: Build the Microsoft Store package
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $ver = (Get-Content companion/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = "companion/src-tauri/target/release/raidkits-companion.exe"
          if (-not (Test-Path $exe)) { throw "App exe not found at $exe" }
          $lay = "msix-layout"; New-Item -ItemType Directory -Force "$lay/Assets", "$lay/legal" | Out-Null
          Copy-Item $exe $lay/
          Copy-Item companion/ui/legal/* "$lay/legal/"
          Copy-Item companion/msix/Assets/* "$lay/Assets/"
          (Get-Content companion/msix/AppxManifest.xml -Raw).Replace("__VERSION__", "$ver.0") | Set-Content "$lay/AppxManifest.xml" -Encoding utf8
          $mk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $mk) { throw "makeappx.exe not found" }
          $out = "Raider.Toolkit.Companion_${ver}_x64_Store.msix"
          & $mk.FullName pack /d $lay /p $out /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed" }
          gh release upload "companion-v$ver" $out --clobber -R $env:GITHUB_REPOSITORY
