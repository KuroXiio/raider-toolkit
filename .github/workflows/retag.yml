name: Move release tags
# One-off: points each release tag at the commit on main with the same files.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move the tags
        run: |
          git fetch --tags --force
          for t in $(git tag); do
            tree=$(git rev-parse "$t^{tree}")
            new=$(git log origin/main --format='%H %T' | awk -v t="$tree" '$2==t {print $1; exit}')
            old=$(git rev-parse "$t^{commit}")
            if [ -n "$new" ] && [ "$new" != "$old" ]; then
              git tag -f "$t" "$new"
              git push -f origin "refs/tags/$t"
              echo "$t moved"
            else
              echo "$t left alone"
            fi
          done
