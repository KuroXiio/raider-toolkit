name: Update data and deploy

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Pillow
        run: pip install pillow
      - name: Keep the last MetaForge download
        uses: actions/cache@v4
        with:
          path: mf-cache
          key: mf-${{ github.run_id }}
          restore-keys: mf-
      - name: Build from the latest data set
        run: bash ./build.sh
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
